<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Info Space | Contacts</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="galaxy-bg"></div>
  
  <nav class="navbar">
    <div class="logo">
      <h1>INFO SPACE</h1>
    </div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="informations.html">Informations</a>
      <a href="about.html">About Us</a>
      <a href="contacts.html">Contacts</a>
      <a href="download.html">Download PDFs</a>
      <a href="login.html">Logout</a>
    </div>
  </nav>
  
  <div class="hero">
    <div class="hero-content">
      <h1>CONTACT US</h1>
      <p>Reach out for collaborations, research inquiries, or technical support</p>
    </div>
  </div>
  
  <div class="card-container">
    <div class="card" style="max-width: 500px; margin: 2rem auto;">
      <form id="contactForm">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label for="subject">Subject</label>
          <input type="text" id="subject" required>
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" rows="5" required></textarea>
        </div>
        <button type="submit" class="glow-btn" style="width: 100%; margin-top: 1rem;">
          Send Message
        </button>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('contactForm').addEventListener('submit', function(e) {
      e.preventDefault();
      alert('Message sent successfully! Our team will contact you shortly.');
      this.reset();
    });
  </script>
</body>
</html>
