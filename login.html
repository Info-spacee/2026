<!-- login.html -->
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Info Space - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hero">
        <div class="card" style="max-width: 400px; margin: auto;">
            <h2 style="text-align: center; margin-bottom: 2rem;">Accesso Segreto</h2>
            <form id="loginForm">
                <div class="form-group">
                    <input type="text" placeholder="Codice Agente" required>
                </div>
                <div class="form-group">
                    <input type="password" placeholder="Password Crittografata" required>
                </div>
                <button type="submit" class="glow-btn" style="width: 100%; margin-top: 1rem;" 
                    onclick="location.href='index.html'">
                    Entra in Info Space
                </button>
            </form>
        </div>
    </div>
</body>
</html>
