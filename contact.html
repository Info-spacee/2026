<!-- contacts.html -->
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Info Space - Contatti</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navbar (condivisa) -->
    <nav class="navbar">
        <!-- identica a index.html -->
    </nav>

    <div class="card-container">
        <div class="card" style="max-width: 600px; margin: auto;">
            <h2 style="text-align: center; margin-bottom: 2rem;">CONTATTA IL TEAM</h2>
            <form>
                <div class="form-group">
                    <input type="text" placeholder="Nome Completo" required>
                </div>
                <div class="form-group">
                    <input type="email" placeholder="Email Segreta" required>
                </div>
                <div class="form-group">
                    <textarea placeholder="Messaggio Crittografato" rows="5" required></textarea>
                </div>
                <button type="submit" class="glow-btn" style="width: 100%; margin-top: 1rem;">
                    Invia Segnalazione
                </button>
            </form>
        </div>
    </div>
</body>
</html>
