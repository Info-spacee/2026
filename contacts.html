<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Info Space | Contacts</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* سأضيف التحسينات هنا */
  </style>
</head>
<body>
  <div class="galaxy-bg"></div>
  
  <nav class="navbar">
    <div class="logo">
      <h1>INFO SPACE</h1>
    </div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="informations.html">Informations</a>
      <a href="about.html">About Us</a>
      <a href="contacts.html">Contacts</a>
      <a href="download.html">Download PDFs</a>
      <a href="login.html">Logout</a>
    </div>
  </nav>
  
  <div class="hero">
    <div class="hero-content">
      <h1>CONTACT US</h1>
      <p>Reach out for collaborations, research inquiries, or technical support</p>
    </div>
  </div>
  
  <div class="card-container">
    <div class="card" style="max-width: 600px; margin: 2rem auto; background: rgba(18, 18, 38, 0.8); border-radius: 15px; padding: 2rem;">
      <form id="contactForm">
        <div class="form-group">
          <label for="name" style="color: #4cc9f0;">Name</label>
          <input type="text" id="name" required style="width: 100%; padding: 12px; background: rgba(255, 255, 255, 0.1); border: 1px solid #4cc9f0; border-radius: 5px; color: white; margin-bottom: 1.5rem;">
        </div>
        <div class="form-group">
          <label for="email" style="color: #4cc9f0;">Email</label>
          <input type="email" id="email" required style="width: 100%; padding: 12px; background: rgba(255, 255, 255, 0.1); border: 1px solid #4cc9f0; border-radius: 5px; color: white; margin-bottom: 1.5rem;">
        </div>
        <div class="form-group">
          <label for="subject" style="color: #4cc9f0;">Subject</label>
          <input type="text" id="subject" required style="width: 100%; padding: 12px; background: rgba(255, 255, 255, 0.1); border: 1px solid #4cc9f0; border-radius: 5px; color: white; margin-bottom: 1.5rem;">
        </div>
        <div class="form-group">
          <label for="message" style="color: #4cc9f0;">Message</label>
          <textarea id="message" rows="5" required style="width: 100%; padding: 12px; background: rgba(255, 255, 255, 0.1); border: 1px solid #4cc9f0; border-radius: 5px; color: white; margin-bottom: 1.5rem;"></textarea>
        </div>
        <button type="submit" class="glow-btn" style="width: 100%; padding: 15px; background: linear-gradient(45deg, #4361ee, #4cc9f0); border: none; border-radius: 50px; color: white; font-weight: bold; font-size: 16px; cursor: pointer; transition: all 0.3s ease;">
          Send Message
        </button>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('contactForm').addEventListener('submit', function(e) {
      e.preventDefault();
      alert('Message sent successfully! Our team will contact you shortly.');
      this.reset();
    });
  </script>
</body>
</html>
